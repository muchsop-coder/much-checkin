.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#D9CFBF;border-radius:999px;transition:.2s;cursor:pointer}
.switch span:before{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{transform:translateX(22px)}

 
.badge.blue{background:#E2EDF9;color:#2F64A3} .stat.blue{background:#E2EDF9} .stat.blue .v{color:#2F64A3} .stat.orange{background:var(--orange-50)} .stat.orange .v{color:#B0571A}
.nbadge{position:absolute;top:4px;right:calc(50% - 26px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.side button{position:relative} .side button .nbadge{position:static;margin-left:auto}
.iconbtn .nbadge{top:2px;right:0}
.bottomnav button{position:relative}
.btn.big{min-height:58px;font-size:18px}
.checkcard h2 .badge{font-size:16px;padding:4px 12px}
.donebox{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--ok-50);color:var(--ok);border-radius:12px;padding:14px;font-weight:500;margin:10px 0}
.donebox .ti{font-size:26px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0 16px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:112px}
.tile .ti{font-size:30px}
.tile .tt{font-weight:500;font-size:16px;margin-top:4px;line-height:1.3}
.tile .nbadge{top:10px;right:10px}
.pstep{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pstep>.ti{font-size:28px;color:var(--brand)}
.lcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card>.lcard{box-shadow:none;border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0}
.card>.lcard:last-child{border-bottom:0}
.tcard.overdue{border-left:4px solid var(--bad)}
.subnote{background:var(--brand-50);border-radius:10px;padding:6px 10px;margin-top:8px}
.subnote.bad{background:var(--bad-50);color:var(--bad)}
.bar{height:10px;background:var(--brand-50);border-radius:6px;overflow:hidden;margin-top:10px}
.bar>div{height:100%;border-radius:6px}
.cl li{padding:14px 4px}
.cl .check{width:34px;height:34px;border-radius:10px}
.cl .tx{font-size:17px}
.roster td,.roster th{text-align:center;padding:6px 4px;min-width:46px}
.roster td:first-child,.roster th:first-child{text-align:left;min-width:110px;position:sticky;left:0;background:var(--paper);z-index:1}
.roster th.today,.roster td.today{background:#FFF6E6}
.roster tr.meRow td:first-child{font-weight:600;color:var(--brand-dark)}
.rchip{display:inline-block;border-radius:8px;padding:2px 6px;font-size:12.5px;white-space:nowrap}
.rchip.gray{background:#EFEAE2;color:var(--ink-2)} .rchip.blue{background:#E2EDF9;color:#2F64A3}
.rwork{color:var(--ok);font-weight:600}
.marks{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px;max-width:260px}
.marks i{width:8px;height:8px;border-radius:2px;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink-2);margin-bottom:16px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
.notif.unread{background:#FFF8EC}
.notif.unread b:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin-right:6px;vertical-align:2px}
.code6{font-family:var(--head);font-size:34px;letter-spacing:8px;background:var(--paper);border:2px dashed var(--brand-100);border-radius:12px;text-align:center;padding:8px;margin:8px 0}
.permgrid{display:grid;gap:6px}
.permgrid label{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.permgrid input{width:22px;height:22px;accent-color:var(--brand)}
.howto summary{cursor:pointer;color:var(--brand-dark);font-weight:500;margin:8px 0}
.howto ol{padding-left:20px;margin:6px 0}
.howto li{margin-bottom:6px}

@media print{
  .topbar,.bottomnav,.side,.actions,.tabs,.no-print,.wm{display:none!important}
  body.noprint *{display:none!important}
  body.noprint:after{content:'ไม่อนุญาตให้พิมพ์';display:block;padding:40px;font-size:24px}
  .main{padding:0}
  .print-all .tabpane{display:block!important}
}
</style>
